# The test pipeline.
#
# Four jobs, ordered by what they cost and how often they catch something.
# The first three need no secrets and no database, so they run on every push
# and on every pull request including from a fork. The end-to-end job needs a
# real database and is gated on that being configured, because a job that
# fails for want of a secret teaches everyone to ignore a red tick.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  # So the suite can be run against a branch by hand without pushing to it.
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in progress on the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile. The service is deployed on this, so it is
          # tested on this; a suite that passes on a version nobody runs is
          # not evidence about production.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite
        working-directory: ai-service
        # No API key is set, so model.py's rephrase() falls back to the
        # template on every call. That is the documented behaviour when the
        # model is unavailable, and the tests mock it in any case.
        run: python -m pytest -q

  web-checks:
    name: Web core (lint, types, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        # postinstall runs prisma generate, which needs the schema and nothing
        # else: the client is generated from the file, not from a live database.
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        # Catches what the tests cannot: a route handler whose signature no
        # longer matches what Next will call it with.
        run: npx tsc --noEmit

      - name: Unit and authorization tests
        working-directory: web
        # The authorization matrix lives here. It needs no database: NextAuth
        # and Prisma are both replaced, so the guards run against a session
        # the test chooses.
        run: npx vitest run

  build:
    name: Containers build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the AI service image
        run: docker build -t thinkkraft-ai:ci ./ai-service

      - name: Build the web image
        # The last several fixes on this repo were to this Dockerfile, so it is
        # worth a job of its own: a green test suite beside an image that will
        # not build is a deploy that fails after everything looked fine.
        run: docker build -t thinkkraft-web:ci ./web

  e2e:
    name: Student journey (Playwright)
    runs-on: ubuntu-latest
    needs: [web-checks]
    # Needs a database to sign a real child in. Skipped, visibly, when one has
    # not been configured for this repository.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      AI_SERVICE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Check whether a test database is configured
        id: gate
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_DATABASE_URL is not set, so the student journey is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Install the browser
        if: steps.gate.outputs.configured == 'true'
        working-directory: web
        # Chromium only. The cross-browser run is a separate concern from the
        # journey being correct, and pulling three browsers on every push buys
        # nothing on a suite this size.
        run: npx playwright install --with-deps chromium

      - name: Apply migrations and seed
        if: steps.gate.outputs.configured == 'true'
        working-directory: web
        # The journey signs in as the seeded child, so the seed is part of the
        # fixture rather than a convenience.
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Build
        if: steps.gate.outputs.configured == 'true'
        working-directory: web
        run: npm run build

      - name: Run the journey
        if: steps.gate.outputs.configured == 'true'
        working-directory: web
        # Against the production build rather than the dev server: that is what
        # is deployed, and middleware behaves differently enough between the
        # two to be worth the build.
        run: |
          npx next start &
          npx wait-on http://localhost:3000 --timeout 120000
          E2E_BASE_URL=http://localhost:3000 npx playwright test

      - name: Keep the report from a failure
        if: ${{ failure() && steps.gate.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
