services:
  db:
    image: postgres:16
    container_name: thinkkraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: thinkkraft
      POSTGRES_PASSWORD: thinkkraft
      POSTGRES_DB: thinkkraft
    ports:
      - "5432:5432"
    volumes:
      - thinkkraft-db-data:/var/lib/postgresql/data

volumes:
  thinkkraft-db-data: