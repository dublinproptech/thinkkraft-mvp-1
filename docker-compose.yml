version: '3.8'

services:
  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      # This will now point to your Neon database URL instead of the local container
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ai-service
    restart: always

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
    restart: always